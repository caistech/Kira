<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="840" viewBox="0 0 1180 840" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <rect width="1180" height="840" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="42" font-size="26" font-weight="700" fill="#111827">KiraExec — System in One Page</text>
  <text x="40" y="66" font-size="14" fill="#6b7280">Technical overview for engineering assessment �of an existing, running AI application</text>
  <text x="1140" y="42" text-anchor="end" font-size="12" fill="#9ca3af">Corporate AI Solutions · 15 Sep 2026</text>

  <!-- ============ LAYER 1: KIRAEXEC ============ -->
  <rect x="40" y="90" width="1100" height="210" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="62" y="118" font-size="17" font-weight="700" fill="#7c3aed">KiraExec — the application</text>
  <text x="62" y="138" font-size="13" fill="#6d28d9">Next.js + React · TypeScript · live at kiraexec.com (owner-facing) · consultant / dev preview</text>

  <!-- capability tiles 8x -->
  <g font-size="12.5" fill="#1f2937">
    <rect x="62" y="158" width="250" height="54" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="187" y="180" text-anchor="middle" font-weight="600">Voice-first interface</text>
    <text x="187" y="198" text-anchor="middle" fill="#6b7280">ElevenLabs conversational AI</text>

    <rect x="324" y="158" width="250" height="54" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="449" y="180" text-anchor="middle" font-weight="600">Business Genome</text>
    <text x="449" y="198" text-anchor="middle" fill="#6b7280">structured business knowledge</text>

    <rect x="586" y="158" width="250" height="54" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="711" y="180" text-anchor="middle" font-weight="600">Persistent memory</text>
    <text x="711" y="198" text-anchor="middle" fill="#6b7280">long-term organisational recall</text>

    <rect x="848" y="158" width="272" height="54" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="984" y="180" text-anchor="middle" font-weight="600">Workflow &amp; task support</text>
    <text x="984" y="198" text-anchor="middle" fill="#6b7280">SOP capture, tasks, follow-through</text>
  </g>

  <g font-size="12.5" fill="#1f2937">
    <rect x="62" y="224" width="250" height="54" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="187" y="246" text-anchor="middle" font-weight="600">Value assessment</text>
    <text x="187" y="264" text-anchor="middle" fill="#6b7280">value &amp; owner-dependence scoring</text>

    <rect x="324" y="224" width="250" height="54" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="449" y="246" text-anchor="middle" font-weight="600">Knowledge capture</text>
    <text x="449" y="264" text-anchor="middle" fill="#6b7280">keeping what sits in the owner's head</text>

    <rect x="586" y="224" width="250" height="54" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="711" y="246" text-anchor="middle" font-weight="600">Organisation &amp; users</text>
    <text x="711" y="264" text-anchor="middle" fill="#6b7280">membership + role-based access</text>

    <rect x="848" y="224" width="272" height="54" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="984" y="246" text-anchor="middle" font-weight="600">CEO / consultant portal</text>
    <text x="984" y="264" text-anchor="middle" fill="#6b7280">admin surfaces incl. distributor management</text>
  </g>

  <!-- arrow L1 -> L2 -->
  <path d="M 590 302 L 590 330" stroke="#7c3aed" stroke-width="2"/>
  <path d="M 585 322 L 590 332 L 595 322" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="610" y="322" font-size="11.5" fill="#6b7280">dispatch requests (contract-versioned API)</text>

