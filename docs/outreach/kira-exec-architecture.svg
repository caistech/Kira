    <rect x="62" y="566" width="240" height="36" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="182" y="589" text-anchor="middle">Xero — invoices &amp; accounts</text>

    <rect x="314" y="566" width="240" height="36" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="434" y="589" text-anchor="middle">Google Workspace — mail, contacts</text>

    <rect x="566" y="566" width="240" height="36" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="686" y="589" text-anchor="middle">Microsoft 365 — mail, calendar, files</text>

    <rect x="818" y="566" width="302" height="36" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="969" y="589" text-anchor="middle">Custom APIs / webhooks — task events</text>
  </g>

  <!-- arrow L3 -> L4 -->
  <path d="M 590 620 L 590 650" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M 585 642 L 590 652 L 595 642" fill="none" stroke="#6b7280" stroke-width="2"/>
  <text x="610" y="644" font-size="11.5" fill="#6b7280">built on</text>

  <!-- ============ LAYER 4: INFRASTRUCTURE ============ -->
  <rect x="40" y="658" width="1100" height="104" rx="14" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="62" y="684" font-size="14" font-weight="700" fill="#4b5563">Infrastructure</text>
  <g font-size="12.5" fill="#1f2937">
    <rect x="62" y="702" width="340" height="42" rx="7" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text x="232" y="721" text-anchor="middle" font-weight="600">Supabase / PostgreSQL</text>
    <text x="232" y="736" text-anchor="middle" fill="#6b7280" font-size="11">row-level security · org tenant boundary</text>

    <rect x="414" y="702" width="200" height="42" rx="7" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text x="514" y="721" text-anchor="middle" font-weight="600">Vercel</text>
    <text x="514" y="736" text-anchor="middle" fill="#6b7280" font-size="11">hosting &amp; deploy pipeline</text>

    <rect x="626" y="702" width="200" height="42" rx="7" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text x="726" y="721" text-anchor="middle" font-weight="600">LLM / AI services</text>
    <text x="726" y="736" text-anchor="middle" fill="#6b7280" font-size="11">classification, drafting, memory</text>

    <rect x="838" y="702" width="282" height="42" rx="7" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text x="979" y="721" text-anchor="middle" font-weight="600">ElevenLabs</text>
    <text x="979" y="736" text-anchor="middle" fill="#6b7280" font-size="11">voice conversational agent</text>
  </g>

  <!-- footer note -->
  <text x="40" y="812" font-size="11.5" fill="#9ca3af">Practical scope for a technical partner: review &amp; harden, testing/monitoring/deploy practices, docs, small enhancements — not a rebuild.</text>
