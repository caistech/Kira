  <rect x="40" y="338" width="1100" height="150" rx="14" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/>
  <text x="62" y="366" font-size="17" font-weight="700" fill="#0f766e">Orchestration layer</text>
  <text x="62" y="386" font-size="13" fill="#475569">decides what should happen and who must approve it — the human-in-the-loop boundary</text>

  <g font-size="12.5" fill="#1f2937">
    <rect x="62" y="404" width="205" height="62" rx="8" fill="#ffffff" stroke="#99f6e4"/>
    <text x="164" y="428" text-anchor="middle" font-weight="600">Dispatch &amp; task registry</text>
    <text x="164" y="446" text-anchor="middle" fill="#6b7280">scheduled work, never silently dropped</text>

    <rect x="283" y="404" width="205" height="62" rx="8" fill="#ffffff" stroke="#99f6e4"/>
    <text x="385" y="428" text-anchor="middle" font-weight="600">Delegation gate</text>
    <text x="385" y="446" text-anchor="middle" fill="#6b7280">approve / notify / auto per action</text>

    <rect x="504" y="404" width="205" height="62" rx="8" fill="#ffffff" stroke="#99f6e4"/>
    <text x="606" y="428" text-anchor="middle" font-weight="600">Clarify round-trip</text>
    <text x="606" y="446" text-anchor="middle" fill="#6b7280">asks for what a task needs, bounded</text>

    <rect x="725" y="404" width="205" height="62" rx="8" fill="#ffffff" stroke="#99f6e4"/>
    <text x="827" y="428" text-anchor="middle" font-weight="600">Connectors</text>
    <text x="827" y="446" text-anchor="middle" fill="#6b7280">Xero, email, contacts, calls (below)</text>

    <rect x="946" y="404" width="174" height="62" rx="8" fill="#ecfeff" stroke="#22d3ee"/>
    <text x="1033" y="422" text-anchor="middle" font-weight="700" fill="#155e75">STAR</text>
    <text x="1033" y="440" text-anchor="middle" fill="#155e75">specialist advisory layer</text>
    <text x="1033" y="456" text-anchor="middle" fill="#155e75" font-size="11">(integration in flight)</text>
  </g>

  <!-- arrow L2 -> L3 -->
  <path d="M 590 490 L 590 520" stroke="#0f766e" stroke-width="2"/>
  <path d="M 585 512 L 590 522 L 595 512" fill="none" stroke="#0f766e" stroke-width="2"/>
  <text x="470" y="514" font-size="11.5" fill="#6b7280">read / effect against tenant-owned external data</text>

  <!-- ============ LAYER 3: CONNECTORS ============ -->
  <g font-size="12.5" fill="#1f2937">
    <rect x="40" y="526" width="1100" height="92" rx="14" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
