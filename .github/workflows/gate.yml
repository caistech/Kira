# Portfolio Standard gate — generated by @caistech/portfolio-migrator
#
# Runs typecheck + lint + build, then route + auth smoke tests against the
# preview deploy URL. Fails the action (and blocks Vercel promotion) on any
# non-zero exit.
#
# Closes Portfolio Standard:
#   R1  — Auth four-leg pattern (auth smoke step)
#   R10 — No verbatim Postgres errors (errorResponse helper, enforced at code level)
#   R13 — Route smoke test on every deploy (route smoke step)

name: portfolio-gate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PORTFOLIO_GATE_PREVIEW_URL: ${{ vars.PORTFOLIO_GATE_PREVIEW_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Detect package manager so the cache step + install step use the
      # right tooling. Pnpm workspaces (TourLingo, NDISSDA, F2K trio) need
      # pnpm/action-setup before setup-node can use the `cache: pnpm` key.
      - name: Detect package manager
        id: detect-pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> $GITHUB_OUTPUT
          else
            echo "pm=npm" >> $GITHUB_OUTPUT
          fi

      - name: Setup pnpm
        if: steps.detect-pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # Setup Node with built-in @caistech registry auth (official pattern).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: ${{ steps.detect-pm.outputs.pm }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@caistech'

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CAISTECH_PACKAGES_TOKEN }}

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Lint
        run: npm run lint --if-present

      # PRODUCT_STANDARDS §4 — every authenticated route renders inside the app chrome.
      #
      # Static, needs no deployment and no secrets, so it runs before the build and fails fast. It is
      # here because the same defect shipped twice in six days at two different URLs (/chat then
      # /talk), both times with the rule known and followed everywhere else. A rule enforced by
      # remembering holds until someone adds a route at 1am.
      - name: App chrome on authenticated routes (PRODUCT_STANDARDS §4)
        run: node scripts/check-app-chrome.mjs

      # DESIGN.md §3 — UI code paints with tokens, not raw hex.
      #
      # Same shape and same reason as the chrome check above: static, no secrets, no deployment,
      # fails fast. It is a RATCHET over ~92 pre-existing literals rather than a clean sweep,
      # because a gate that is red on arrival is a gate somebody deletes. It fails only when a file
      # gains a literal it did not have.
      - name: Design tokens (DESIGN.md §3)
        run: node scripts/check-design-tokens.mjs

      - name: Build
        run: npm run build --if-present
        # Placeholder build-time env so `next build` can CONSTRUCT clients during prerender / page-data
        # collection without real secrets (CI has none). Values are dummy — the build only constructs
        # clients, it never calls them; runtime uses the real Vercel env. This CI build is a compile
        # check only and is never deployed. Add a key here if a future module-load construction breaks
        # the build. (Longer term, prefer lazy client init over module-load construction — see the
        # Stripe getStripe() pattern.)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_APP_URL: https://kira.vercel.app
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          ELEVENLABS_API_KEY: placeholder-elevenlabs-key

      - name: Verify preview URL is set
        run: |
          if [ -z "$PORTFOLIO_GATE_PREVIEW_URL" ]; then
            echo "::error::PORTFOLIO_GATE_PREVIEW_URL is not set. Wire it via repo vars or a preview-deploy step."
            exit 1
          fi
          echo "Preview URL: $PORTFOLIO_GATE_PREVIEW_URL"

      # TEMPORARY (2026-05-19 — portfolio migration in progress):
      # static audits emit warnings but DO NOT block the gate. Revert to
      # blocking by removing the `|| ...` wrapper once the R3 explanatory-header
      # + R14 sample-artefact backfill is done across the portfolio.
      - name: Static audits (R3 / R9 / R11 / R14 / R15 — warning-only)
        run: |
          npx --no-install portfolio-gate-audit-all \
            --base-url "$PORTFOLIO_GATE_PREVIEW_URL" \
            || echo "::warning::Portfolio Standard audits found violations — see step output. Migration in progress; not blocking deploy. Revert this step to blocking once R3 + R14 backfill is complete."

      - name: Route smoke test (Portfolio Standard R13)
        run: |
          npx --no-install portfolio-gate-smoke-routes \
            --config routes.config.json \
            --base-url "$PORTFOLIO_GATE_PREVIEW_URL"

      - name: Auth smoke test (Portfolio Standard R1/R4)
        run: |
          npx --no-install portfolio-gate-smoke-auth \
            --config auth.config.json \
            --base-url "$PORTFOLIO_GATE_PREVIEW_URL"

      # Voice memory-loop gate — SKIPS CLEANLY (exit 0) in any repo that does not declare
      # @caistech/elevenlabs-convai, so it is safe in every repo and costs nothing where there is
      # no voice agent.
      #
      # It is here, in the shared gate, rather than in each repo's own workflow, because the
      # previous arrangement was "each product remembers to verify its own memory loop" — and
      # probeMemoryLoop shipped in 0.7.0 and ran in ZERO repos. The guard existed; nobody ran it;
      # the bug reached production twice. Verification has to be the default, not an act of
      # discipline.
      #
      # Needs, in repos that DO have a voice agent:
      #   MEMORY_LOOP_UID / QA_TEST_USER_ID   a real test user's id
      #   CONVAI_TOOL_SECRET                  if the webhook routes are secret-guarded
      #   NEXT_PUBLIC_SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY   for sentinel cleanup
      # and a memory-loop.config.json naming the webhook path, memory table and tool-secret header.
      - name: Voice memory-loop gate (skips where there is no voice agent)
        env:
          MEMORY_LOOP_UID: ${{ secrets.QA_TEST_USER_ID }}
          CONVAI_TOOL_SECRET: ${{ secrets.CONVAI_TOOL_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Resolve the binary from node_modules DIRECTLY, never via a bare `npx <name>`.
          #
          # `npx --no-install` does not reliably refuse the network. Where the local bin was absent
          # it queried the PUBLIC registry for an unscoped `portfolio-gate-memory-loop`, got a 404,
          # and failed the gate — turning a step that is supposed to skip into a hard failure in
          # every repo whose @caistech/portfolio-gate predates 0.7.0. When this was first swept in
          # that was 26 of 27 repos, all still on ^0.3.0.
          #
          # The skip is a WARNING, not silence. A step that quietly passes when it did not run is
          # the exact failure this gate exists to correct: probeMemoryLoop shipped in 0.7.0 and ran
          # in zero repos precisely because nothing said so out loud.
          BIN=node_modules/.bin/portfolio-gate-memory-loop
          if [ ! -x "$BIN" ]; then
            echo "::warning title=Voice memory loop NOT verified::@caistech/portfolio-gate in this repo predates the memory-loop gate (needs >=0.7.0). The voice memory loop is not being checked here. Bump the dependency to enable it."
            exit 0
          fi
          "$BIN" --config memory-loop.config.json --base-url "$PORTFOLIO_GATE_PREVIEW_URL"

      # Static counterpart to the runtime probe. The Mnemo dual-write happens in the POST-CALL
      # path, which probeMemoryLoop never triggers — so a product missing the semantic leg passes
      # all five runtime checks with no semantic index at all. That is how one product's leg went
      # missing unnoticed. Some checks are only expressible statically; this is one.
      # Skips in non-voice repos. A deliberate omission is declared, not silent:
      #   memory-loop.config.json  ->  { "semanticMemory": false }
      - name: Voice semantic-memory wiring (static; skips where there is no voice agent)
        run: |
          # Same direct resolution + loud skip as the runtime probe above.
          BIN=node_modules/.bin/portfolio-gate-audit-voice-memory
          if [ ! -x "$BIN" ]; then
            echo "::warning title=Voice semantic-memory wiring NOT audited::@caistech/portfolio-gate in this repo predates the static voice-memory audit (needs >=0.7.0). Bump the dependency to enable it."
            exit 0
          fi
          "$BIN"

      # First paint — does the page a visitor lands on SAY anything before the JavaScript arrives?
      #
      # The sibling of the route smoke test above, and it exists because that one cannot see this:
      # /plan, /login and /signup all answered 200, on the expected commit, with no redirect, while
      # serving a header, a footer and SIXTEEN characters of content. A tester timed fifteen seconds
      # of white on the page that asks for a card. Every status-code assertion in this file was green
      # over it, correctly — they ask whether the page RESPONDS, this asks whether it says anything.
      #
      # BLOCKING, not warning-only. Unlike the static audits above there is no migration backlog to
      # drain: it judges what production serves right now, and a blank page is not a style nit.
      - name: First paint has content (pages marked @public-route)
        run: |
          BIN=node_modules/.bin/portfolio-gate-audit-first-paint
          if [ ! -x "$BIN" ]; then
            echo "::warning title=First paint NOT verified::@caistech/portfolio-gate in this repo predates the first-paint audit (needs >=0.12.0). Blank-then-appear pages are not being checked. Bump the dependency to enable it."
            exit 0
          fi
          "$BIN" --base-url "$PORTFOLIO_GATE_PREVIEW_URL"

      # Playwright, for the input-response audit below only. Installed as a separate step so a
      # failure here reads as "the browser did not install" rather than "the widget is broken" —
      # two very different messages to whoever opens the red build.
      - name: Install Chromium (for the input-response audit)
        run: |
          if [ -x node_modules/.bin/portfolio-gate-audit-input-response ] && [ -x node_modules/.bin/playwright ]; then
            npx playwright install --with-deps chromium
          else
            echo "Skipping browser install — input-response audit or playwright not present."
          fi

      # Input response — type into it, submit, and assert something comes back.
      #
      # The voice-agent audit in `audit-all` above is, in its own words, a PRESENCE check. Two
      # products shipped past it the same day with a widget that rendered perfectly and did nothing:
      # this one ate a buyer's question and fired zero network requests. "Launcher x 2, panel x 1 —
      # the voice agent is live" was reported off two true numbers that meant nothing.
      #
      # Reports a RATE, not a verdict: this widget answers ~14 times in 20, so a single-run check
      # passes about a third of the time and would be switched off within a week of flaking.
      #
      # ⚠️ IT REALLY SUBMITS, against the URL below, on every run. Only pages marked @accepts-input
      # are driven, and that marker means "junk may be submitted here forever". Never mark signup,
      # password-reset or contact forms.
      - name: Input gets a response (pages marked @accepts-input)
        run: |
          BIN=node_modules/.bin/portfolio-gate-audit-input-response
          if [ ! -x "$BIN" ]; then
            echo "::warning title=Input response NOT verified::@caistech/portfolio-gate in this repo predates the input-response audit (needs >=0.13.0). A control that renders and swallows what is typed into it is not being checked. Bump the dependency to enable it."
            exit 0
          fi
          "$BIN" --base-url "$PORTFOLIO_GATE_PREVIEW_URL"
