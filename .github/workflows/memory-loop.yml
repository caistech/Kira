# Memory-loop behavioural test — the anti-recurrence gate.
#
# Kira's voice-memory loop was "fixed" four times from code inspection and stayed broken each time,
# because nobody ran the whole chain: talk -> disconnect -> reconnect -> assert recall. This runs
# exactly that, against the DEPLOYED prod webhook loop, so a regression in tool-auth or
# cross-conversation recall fails CI instead of shipping silently.
#
# It now runs the CANONICAL probe (@caistech/portfolio-gate's memory-loop gate, wrapping
# probeMemoryLoop from @caistech/elevenlabs-convai) rather than Kira's own 202-line script.
# That script was written during the four-failed-fixes saga, BEFORE the package shipped the guard
# in 0.7.0 — so it was a fork of something the package now owns, and it could not have been
# catching the continuity case the package added in 0.7.3.
#
# Secrets required (synced from cais-shared-services QA secrets):
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, KIRA_TOOL_WEBHOOK_SECRET
#   (optional) QA_TEST_USER_EMAIL — defaults to dennis@factory2key.com.au
#   (optional var) MEMORY_LOOP_APP_URL — defaults to https://kira-rho.vercel.app

name: memory-loop

on:
  schedule:
    - cron: '0 7 * * *' # daily, after health-full
  workflow_dispatch:
  push:
    branches: [main]
    # Every input the probe's verdict actually depends on. A path missing here is a change that
    # can break the loop without re-running the gate that exists to catch it.
    paths:
      - 'lib/kira/convai.ts'
      - 'lib/kira/recall.ts'
      - 'app/api/kira/webhooks/**'
      - 'app/api/convai/webhooks/**'
      - 'app/api/kira/create/route.ts'
      # The config IS the probe's configuration — target routes, tables, identity mode, the
      # tool-secret header. Editing it silently changed what the gate asserts and never re-ran it.
      - 'memory-loop.config.json'
      - '.github/workflows/memory-loop.yml'

jobs:
  memory-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KIRA_TOOL_WEBHOOK_SECRET: ${{ secrets.KIRA_TOOL_WEBHOOK_SECRET }}
      QA_TEST_USER_EMAIL: ${{ secrets.QA_TEST_USER_EMAIL }}
      # The probe bakes identity into the tool URL as ?uid=, so it needs the USER ID.
      MEMORY_LOOP_UID: ${{ secrets.QA_TEST_USER_ID }}
      # The probe reads MEMORY_LOOP_APP_URL / PORTFOLIO_GATE_PREVIEW_URL — NOT NEXT_PUBLIC_APP_URL,
      # which is what this workflow used to set. `vars.MEMORY_LOOP_APP_URL` was also never defined
      # on the repo, so the value was empty AND under the wrong name: the probe failed closed with
      # "no base URL" on every run since it was wired, and the two red runs on main were a gate that
      # never executed rather than a memory loop that broke. It is passed as an explicit --base-url
      # below (the same shape gate.yml uses) so it cannot silently resolve to nothing again.
      MEMORY_LOOP_APP_URL: ${{ vars.MEMORY_LOOP_APP_URL || vars.PORTFOLIO_GATE_PREVIEW_URL || 'https://kira-rho.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CAISTECH_PACKAGES_TOKEN }}
      - name: Guard — required config present
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$KIRA_TOOL_WEBHOOK_SECRET" ]; then
            echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY or KIRA_TOOL_WEBHOOK_SECRET — sync QA secrets from cais-shared-services."
            exit 1
          fi
          if [ -z "$MEMORY_LOOP_APP_URL" ]; then
            echo "::error::No app URL for the memory-loop probe — set the MEMORY_LOOP_APP_URL or PORTFOLIO_GATE_PREVIEW_URL repo variable."
            exit 1
          fi
          echo "memory-loop target: $MEMORY_LOOP_APP_URL"
      - name: Run memory-loop E2E (canonical probe)
        run: npx --no-install portfolio-gate-memory-loop --config memory-loop.config.json --base-url "$MEMORY_LOOP_APP_URL"
