# Naive tester — automated human walkthrough.
#
# Walks the live product as a first-time end-user: landing (desktop + mobile), form
# login (exercises the auth path), and an authed surface. Records results via gate-check
# (source=naive-tester). Anything the model can't decide → na (degrade-don-fake).
#
# This is the Playwright agent from cais-shared-services/scripts/agents/. It screenshots
# desktop (1280px) + mobile (390px) viewports, then asks the OmniRoute vision judge to
# verdict the naive-method rubric checks (#1-#41). No paid Anthropic call — the verdicts
# route through the same OmniRoute gateway the Kira Testing service uses.
#
# Triggered after every production deployment and weekly (catches model drift).
# The weekly run is the same as the post-deploy run — identical coverage, different trigger.

name: naive-tester

on:
  deployment_status:
    types: [success]
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC, after red-team (06:00)
  workflow_dispatch:

jobs:
  naive-tester:
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_USER_EMAIL: ${{ secrets.QA_TEST_USER_EMAIL }}
      QA_USER_PASSWORD: ${{ secrets.QA_TEST_USER_PASSWORD }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Fetch the canonical naive-tester from cais-shared-services exactly like red-team does —
      # zero-dep Playwright agent, gate-check recording, no forked copy.
      - name: Fetch the canonical naive-tester
        uses: actions/checkout@v4
        with:
          repository: caistech/cais-shared-services
          path: shared
          token: ${{ secrets.CAISTECH_PACKAGES_TOKEN }}
          sparse-checkout: scripts/agents
          sparse-checkout-cone-mode: false

      - name: Install naive-tester dependencies
        working-directory: shared/scripts/agents
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CAISTECH_PACKAGES_TOKEN }}

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: shared/scripts/agents

      # LOCAL_VISION_MODEL + LOCAL_VISION_API + LOCAL_VISION_API_KEY route verdicts to OmniRoute
      # (OpenAI-compatible, Bearer-authed) — free mode, no Anthropic. The judge fails loudly if the
      # endpoint is unreachable rather than silently degrading to na for every check — the same
      # confusion red-team guards against (a run that quietly does nothing looks identical to one
      # that passed).
      - name: Run naive tester
        working-directory: shared/scripts/agents
        run: |
          if [ -z "$LOCAL_VISION_MODEL" ]; then echo "::error::LOCAL_VISION_MODEL (the OmniRoute vision combo) is required" && exit 1; fi
          PROD_URL="${{ github.event.deployment_status.target_url || vars.PRODUCTION_URL || 'https://kiraexec.com' }}"
          node naive-tester.mjs \
            --slug kira \
            --url "$PROD_URL" \
            ${{ github.event_name == 'deployment_status' && format('--deployment {0}', github.event.deployment.id) || '' }}
        env:
          # LOCAL_VISION_API must be the FULL endpoint (base + /v1/chat/completions) because the
          # naive-tester calls it directly — unlike kira-testing which appends the path.
          LOCAL_VISION_MODEL: ${{ vars.KIRA_TESTING_MODEL_COMBO || 'kira-testing' }}
          LOCAL_VISION_API: ${{ format('{0}/v1/chat/completions', secrets.KIRA_TESTING_OMNIROUTE_BASE_URL || secrets.OMNIROUTE_BASE_URL) }}
          LOCAL_VISION_API_KEY: ${{ secrets.KIRA_TESTING_OMNIROUTE_API_KEY || secrets.OMNIROUTE_API_KEY }}
